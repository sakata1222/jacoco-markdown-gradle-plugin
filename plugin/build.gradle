plugins {
    id "com.gradle.plugin-publish" version "2.2.1"
    id 'java-gradle-plugin'
    id 'checkstyle'
    id "com.github.spotbugs" version "6.5.12"
    id 'jacoco'
    id "com.github.sakata1222.jacoco-markdown" version "1.5.2"
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile) {
    options.compilerArgs.addAll(["--release", "8", "-Xlint:all", "-Werror"])
}

checkstyle {
    // Checkstyle 11+ requires JDK 21, while functional tests must run on JDK 17 to exercise Gradle 7.3.
    toolVersion = "10.26.1"
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
    excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
}

dependencies {
    // JUnit 6 requires Java 17, so stay on 5.x to keep test code on --release 8
    testImplementation "org.junit.jupiter:junit-jupiter:5.14.4"
    testImplementation "org.assertj:assertj-core:3.27.7"
    testImplementation "commons-io:commons-io:2.22.0"
    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation gradleApi()
    testImplementation localGroovy()

    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

version = '1.5.2'
group = 'gradle.plugin.com.github.sakata1222'

gradlePlugin {
    // Define the plugin
    website = 'https://github.com/sakata1222/jacoco-markdown-gradle-plugin'
    vcsUrl = 'https://github.com/sakata1222/jacoco-markdown-gradle-plugin'
    plugins {
        jacocoMd {
            id = 'com.github.sakata1222.jacoco-markdown'
            implementationClass = 'jp.gr.java_conf.spica.plugin.gradle.jacoco.JacocoMarkdownPlugin'
            displayName = 'jacoco markdown report plugin'
            description = 'Gradle plugin to parse jacoco report as a markdown'
            tags.set(['test', 'coverage', 'code coverage', 'jacoco', 'markdown'])
        }
    }
}

// Add a source set for the functional test suite
sourceSets {
    functionalTest {
    }
}

gradlePlugin.testSourceSets(sourceSets.functionalTest)
configurations.functionalTestImplementation.extendsFrom(configurations.testImplementation)
configurations.functionalTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)

// Add a task to run the functional tests
tasks.register('functionalTest', Test) {
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    it.useJUnitPlatform()
    it.finalizedBy jacocoTestReport
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test, functionalTest
    mustRunAfter test, functionalTest
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    // Run the functional tests as part of `check`
    dependsOn(tasks.functionalTest)
}
